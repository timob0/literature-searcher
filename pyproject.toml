[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-literature-search"
version = "0.1.0"
description = "Local academic semantic literature search over Zotero PDFs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pyzotero>=1.12",
  "PyMuPDF>=1.24",
  "sentence-transformers>=3.0",
  "chromadb>=0.5.0",
  "streamlit>=1.36",
  "typer>=0.12",
  "cmd2>=2.4",
  "ollama>=0.6",
  "openai>=1.100",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
